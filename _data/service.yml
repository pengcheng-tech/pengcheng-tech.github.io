# service.yml — academic services.
# Rendered on:
#   /activities/  — full service sections (Editorial / Conference Reviewer /
#                   Journal Reviewer), grouped with `groups`.
#   Homepage      — `featured` items only, with a "See all" link to /activities/.
#
# Structure (global sorting rule, see docs/update-workflow.md §5):
#   featured / bullets are object arrays: {text, date_sort, date_estimated?}
#   date_sort = 受邀时间 (YYYY-MM); date_estimated: true when the value is an
#   estimate (e.g. year-default YYYY-01) rather than the exact invite date.
#   Group-level `sort`: `date` (default, bullets sorted by date_sort desc) |
#   `none` (kept in file order — Journal Reviewer ordered by journal standing,
#   Editorial descriptive bullets).
#   Rendering is position-independent (sorted by date_sort); file order is
#   kept for diff readability.
#
# Sections keep the page's original wording; USENIX Security 2027 was added
# to Program Committee Membership (service data now drives the page).

