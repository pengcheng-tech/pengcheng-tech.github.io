- category: research
  title: Finalist for "Most Innovative Research" Pwnie Award
  event: Black Hat USA 2019
  year: 2019
  bullets:
  - label: Role
    text: First Author (1st of 4 contributors)
  - label: Research
    text: '"SonarSnoop: Active Acoustic Side-Channel Attacks"'
  - label: Significance
    text: International recognition at one of the world's most prestigious cybersecurity
      conferences
  - label: Impact
    text: Praised by renowned security experts including Bruce Schneier and Prof.
      Ross Anderson
  quote_label: 'Official Citation (2019):'
  quote: '"Ok, you know we''re down when the paper reads like it is out of a James
    Bond book, or at least that in some dark corner of the NSA there is a scientist
    who''s pissed about it. In this paper, the researchers use speakers to emit human
    inaudible sounds as part of a sonar system to track victim''s finger movements.
    Doing this while the victim unlocks their phone doesn''t give them the exact unlock
    pattern but does greatly reduce the number of patterns to try. Straight off the
    sci-fi channel when it still played had sci fi shows, the only minor issue is
    they only tested it against 10 subjects and since it is an academic paper, it''s
    probably entirely impractical."'
  historical:
    label: Historical Reference
    text: Original Pwnie Award Nominations (Internet Archive)
    url: https://web.archive.org/web/20190919051259/https://pwnies.com/nominations/
  featured: true
