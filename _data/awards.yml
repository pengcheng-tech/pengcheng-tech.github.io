- category: industry
  title: Watermarking System Vulnerabilities - Amazon Collaboration (2025)
  bullets:
  - label: Research Impact
    text: Developed WMCopier attack method that identified critical vulnerabilities
      in Amazon's watermarking systems (Titan Image Generator and Amazon Nova Canvas)
  - label: Collaborative Partnership
    text: Amazon's Responsible AI Team acknowledged the research contribution and
      collaborated on security improvements
  - label: Recognition
    text: Received official statement and thank you letter from AWS Security Outreach
      Team
  quote_label: 'Official Amazon Statement (March 28, 2025):'
  quote: '"We appreciate the researchers from the State Key Laboratory of Blockchain
    and Data Security at Zhejiang University for reporting this issue and collaborating
    with us... We are grateful for reports from the security community, and your report
    was an excellent example of a positive coordinated disclosure."'
